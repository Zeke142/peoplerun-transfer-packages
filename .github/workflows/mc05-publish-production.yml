name: MC05 Publish Production Envelope

on:
  pull_request:
    paths:
      - ".github/workflows/mc05-publish-production.yml"
      - "ops/mc05/production/PRODUCTION_PATH_CONTRACT_V1.json"
  push:
    branches: ["main"]
    paths:
      - "ops/mc05/production/invocations/**/release-manifest.json"
  workflow_dispatch:
    inputs:
      operation_id:
        description: "Existing immutable production operation to wake exactly once"
        required: true
        type: string

permissions:
  contents: write
  issues: write

env:
  MC05_WAKE_TITLE_PREFIX: "MC05 production invocation"
  MC05_WAKE_ASSIGNEE: "Zeke142"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Test production invocation and wake contracts
        shell: bash
        run: |
          python3 - <<'PY'
          import copy
          import re
          from urllib.parse import urlsplit

          REQUIRED = {
              "schema", "operation_id", "envelope_url",
              "expected_envelope_sha256", "expected_envelope_size_bytes",
              "envelope_receipt_sha256", "transport_event_id", "trigger_event_id",
          }

          def validate(invocation, operation_id, release_tag, production):
              assert production is True
              assert operation_id == release_tag
              assert set(invocation) == REQUIRED
              assert invocation["schema"] == "peoplerun.mc05.shortcut_input.v2"
              assert invocation["operation_id"] == operation_id
              assert re.fullmatch(r"[0-9a-f]{64}", invocation["expected_envelope_sha256"])
              assert re.fullmatch(r"[0-9a-f]{64}", invocation["envelope_receipt_sha256"])
              assert isinstance(invocation["expected_envelope_size_bytes"], int)
              assert invocation["expected_envelope_size_bytes"] > 0
              parsed = urlsplit(invocation["envelope_url"])
              expected_path = f"/Zeke142/peoplerun-transfer-packages/releases/download/{operation_id}/envelope.zip"
              assert parsed.scheme == "https"
              assert parsed.hostname == "github.com"
              assert parsed.path == expected_path
              assert not parsed.query and not parsed.fragment

          def marker(operation_id, invocation_sha):
              assert re.fullmatch(r"[A-Za-z0-9._-]+", operation_id)
              assert re.fullmatch(r"[0-9a-f]{64}", invocation_sha)
              return f"<!-- mc05-production-wake-v2 operation_id={operation_id} invocation_sha256={invocation_sha} -->"

          def activation_marker(operation_id, invocation_sha):
              assert re.fullmatch(r"[A-Za-z0-9._-]+", operation_id)
              assert re.fullmatch(r"[0-9a-f]{64}", invocation_sha)
              return f"<!-- mc05-production-wake-v3-activation operation_id={operation_id} invocation_sha256={invocation_sha} -->"

          def wake_title(operation_id):
              assert re.fullmatch(r"[A-Za-z0-9._-]+", operation_id)
              title = f"MC05 production invocation {operation_id}"
              assert len(title) <= 256
              return title

          op = "mc05-prod-20260914-contract-fixture-v1"
          good = {
              "schema": "peoplerun.mc05.shortcut_input.v2",
              "operation_id": op,
              "envelope_url": f"https://github.com/Zeke142/peoplerun-transfer-packages/releases/download/{op}/envelope.zip",
              "expected_envelope_sha256": "a" * 64,
              "expected_envelope_size_bytes": 123,
              "envelope_receipt_sha256": "b" * 64,
              "transport_event_id": "fixture-transport",
              "trigger_event_id": "fixture-trigger",
          }

          checks = 0
          validate(good, op, op, True)
          checks += 1

          mutations = [
              ("production_false", lambda x: validate(x, op, op, False)),
              ("release_mismatch", lambda x: validate(x, op, "wrong", True)),
              ("schema", lambda x: x.__setitem__("schema", "wrong")),
              ("operation", lambda x: x.__setitem__("operation_id", "wrong")),
              ("host", lambda x: x.__setitem__("envelope_url", x["envelope_url"].replace("github.com", "example.com"))),
              ("path", lambda x: x.__setitem__("envelope_url", x["envelope_url"].replace("envelope.zip", "wrong.zip"))),
              ("query", lambda x: x.__setitem__("envelope_url", x["envelope_url"] + "?x=1")),
              ("fragment", lambda x: x.__setitem__("envelope_url", x["envelope_url"] + "#x")),
              ("sha", lambda x: x.__setitem__("expected_envelope_sha256", "bad")),
              ("receipt_sha", lambda x: x.__setitem__("envelope_receipt_sha256", "bad")),
              ("size", lambda x: x.__setitem__("expected_envelope_size_bytes", 0)),
              ("extra", lambda x: x.__setitem__("unexpected", True)),
          ]
          for name, mutate in mutations:
              candidate = copy.deepcopy(good)
              failed = False
              try:
                  if name in {"production_false", "release_mismatch"}:
                      mutate(candidate)
                  else:
                      mutate(candidate)
                      validate(candidate, op, op, True)
              except AssertionError:
                  failed = True
              assert failed, f"mutation was accepted: {name}"
              checks += 1

          wake = marker(op, "c" * 64)
          assert wake == marker(op, "c" * 64)
          assert wake != marker(op, "d" * 64)
          checks += 2
          assert wake_title(op) == f"MC05 production invocation {op}"
          assert wake_title(op) != wake_title(op + "-next")
          checks += 2
          activation = activation_marker(op, "e" * 64)
          assert activation == activation_marker(op, "e" * 64)
          assert activation != activation_marker(op, "f" * 64)
          assert activation != wake
          checks += 3
          try:
              marker("invalid operation", "c" * 64)
          except AssertionError:
              checks += 1
          else:
              raise AssertionError("invalid operation marker accepted")

          for invalid in ("invalid operation", "x" * 230):
              try:
                  wake_title(invalid)
              except AssertionError:
                  checks += 1
              else:
                  raise AssertionError("invalid wake title accepted")

          for bad_op, bad_sha in (("invalid operation", "e" * 64), (op, "bad")):
              try:
                  activation_marker(bad_op, bad_sha)
              except AssertionError:
                  checks += 1
              else:
                  raise AssertionError("invalid activation marker accepted")

          assert checks == 25
          print("MC05 production wake contract tests: 25/25 PASS")
          PY

  publish:
    if: github.event_name == 'push'
    needs: contract-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production issuance commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate, publish, and wake once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t manifests < <(git diff-tree --no-commit-id --diff-filter=A --name-only -r "${GITHUB_SHA}" | grep -E '^ops/mc05/production/invocations/[^/]+/release-manifest\.json$' || true)
          test "${#manifests[@]}" -eq 1
          manifest="${manifests[0]}"
          dir="$(dirname "$manifest")"
          test -f "$dir/envelope.zip"
          test -f "$dir/invocation.json"
          test -f "$dir/envelope_receipt.json"
          test -f "$dir/ENVELOPE.sha256"
          operation_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["operation_id"])' "$manifest")"
          release_tag="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["release_tag"])' "$manifest")"
          production="$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["production"]).lower())' "$manifest")"
          test "$production" = "true"
          test "$operation_id" = "$release_tag"
          test "$dir" = "ops/mc05/production/invocations/$operation_id"
          python3 - "$dir/invocation.json" "$operation_id" <<'PY'
          import json
          import re
          import sys
          from urllib.parse import urlsplit

          invocation_path, operation_id = sys.argv[1:]
          with open(invocation_path, encoding="utf-8") as handle:
              invocation = json.load(handle)
          required = {
              "schema", "operation_id", "envelope_url",
              "expected_envelope_sha256", "expected_envelope_size_bytes",
              "envelope_receipt_sha256", "transport_event_id", "trigger_event_id",
          }
          assert set(invocation) == required
          assert invocation["schema"] == "peoplerun.mc05.shortcut_input.v2"
          assert invocation["operation_id"] == operation_id
          assert re.fullmatch(r"[0-9a-f]{64}", invocation["expected_envelope_sha256"])
          assert re.fullmatch(r"[0-9a-f]{64}", invocation["envelope_receipt_sha256"])
          assert isinstance(invocation["expected_envelope_size_bytes"], int)
          assert invocation["expected_envelope_size_bytes"] > 0
          expected_path = f"/Zeke142/peoplerun-transfer-packages/releases/download/{operation_id}/envelope.zip"
          parsed = urlsplit(invocation["envelope_url"])
          assert parsed.scheme == "https" and parsed.hostname == "github.com"
          assert parsed.path == expected_path and not parsed.query and not parsed.fragment
          PY
          (cd "$dir" && sha256sum -c ENVELOPE.sha256)
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite or retry."
            exit 1
          fi
          gh release create "$release_tag" \
            "$dir/envelope.zip#envelope.zip" \
            "$dir/invocation.json#invocation.json" \
            "$dir/envelope_receipt.json#envelope_receipt.json" \
            --target "${GITHUB_SHA}" \
            --title "MC05 production invocation $operation_id" \
            --notes "One governed production MC05 invocation. No automatic retry." \
            --latest
          invocation_sha="$(sha256sum "$dir/invocation.json" | awk '{print $1}')"
          marker="<!-- mc05-production-wake-v2 operation_id=$operation_id invocation_sha256=$invocation_sha -->"
          wake_title="${MC05_WAKE_TITLE_PREFIX} ${operation_id}"
          test "${#wake_title}" -le 256
          existing="$(gh issue list --state all --limit 1000 --json title --jq "[.[] | select(.title == \"$wake_title\")] | length")"
          test "$existing" = "0"
          issue_url="$(gh issue create \
            --title "$wake_title" \
            --assignee "$MC05_WAKE_ASSIGNEE" \
            --body "$(printf '%s\n\n%s\n%s\n%s\n' "$marker" "Operation: $operation_id" "Invocation SHA-256: $invocation_sha" 'Machine-issued production wake record. Activation requires the single marked bot comment below.')")"
          issue_number="${issue_url##*/}"
          printf '%s' "$issue_number" | grep -Eq '^[0-9]+$'
          activation_marker="<!-- mc05-production-wake-v3-activation operation_id=$operation_id invocation_sha256=$invocation_sha -->"
          activation_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments" --jq ".[] | select(.body | contains(\"$activation_marker\")) | .id" | wc -l | tr -d ' ')"
          test "$activation_count" = "0"
          gh issue comment "$issue_number" --body "$(printf '%s\n\n%s\n%s\n%s\n' "$activation_marker" '@Zeke142' "Operation: $operation_id" 'Machine-issued production wake. Do not edit or replay.')"

  corrective-wake:
    if: github.event_name == 'workflow_dispatch'
    needs: contract-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active production state
        uses: actions/checkout@v4

      - name: Wake one existing immutable production operation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          set -euo pipefail
          printf '%s' "$OPERATION_ID" | grep -Eq '^[A-Za-z0-9._-]+$'
          dir="ops/mc05/production/invocations/$OPERATION_ID"
          test -f "$dir/release-manifest.json"
          test -f "$dir/invocation.json"
          manifest_operation="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["operation_id"])' "$dir/release-manifest.json")"
          manifest_tag="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["release_tag"])' "$dir/release-manifest.json")"
          manifest_production="$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["production"]).lower())' "$dir/release-manifest.json")"
          invocation_operation="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["operation_id"])' "$dir/invocation.json")"
          test "$manifest_operation" = "$OPERATION_ID"
          test "$manifest_tag" = "$OPERATION_ID"
          test "$manifest_production" = "true"
          test "$invocation_operation" = "$OPERATION_ID"
          release_state="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${OPERATION_ID}" --jq '[.tag_name,.draft,.prerelease] | map(tostring) | join("|")')"
          test "$release_state" = "${OPERATION_ID}|false|false"
          invocation_sha="$(sha256sum "$dir/invocation.json" | awk '{print $1}')"
          marker="<!-- mc05-production-wake-v2 operation_id=$OPERATION_ID invocation_sha256=$invocation_sha -->"
          wake_title="${MC05_WAKE_TITLE_PREFIX} ${OPERATION_ID}"
          test "${#wake_title}" -le 256
          matches="$(gh issue list --state all --limit 1000 --json number,title,state,author --jq "[.[] | select(.title == \"$wake_title\")]")"
          match_count="$(jq 'length' <<<"$matches")"
          if [ "$match_count" = "0" ]; then
            issue_url="$(gh issue create \
              --title "$wake_title" \
              --assignee "$MC05_WAKE_ASSIGNEE" \
              --body "$(printf '%s\n\n%s\n%s\n%s\n' "$marker" "Operation: $OPERATION_ID" "Invocation SHA-256: $invocation_sha" 'Machine-issued corrective wake record. Activation requires the single marked bot comment below.')")"
            issue_number="${issue_url##*/}"
          elif [ "$match_count" = "1" ]; then
            issue_number="$(jq -r '.[0].number' <<<"$matches")"
            test "$(jq -r '.[0].state' <<<"$matches")" = "OPEN"
            test "$(jq -r '.[0].author.login' <<<"$matches")" = "github-actions[bot]"
          else
            echo "Multiple wake records exist for one operation; refusing ambiguous activation."
            exit 1
          fi
          printf '%s' "$issue_number" | grep -Eq '^[0-9]+$'
          activation_marker="<!-- mc05-production-wake-v3-activation operation_id=$OPERATION_ID invocation_sha256=$invocation_sha -->"
          activation_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments" --jq ".[] | select(.body | contains(\"$activation_marker\")) | .id" | wc -l | tr -d ' ')"
          if [ "$activation_count" != "0" ]; then
            echo "Activation wake already emitted for this exact operation and invocation; refusing duplicate."
            exit 1
          fi
          gh issue comment "$issue_number" --body "$(printf '%s\n\n%s\n%s\n%s\n' "$activation_marker" '@Zeke142' "Operation: $OPERATION_ID" 'Machine-issued corrective production wake. Do not edit or replay.')"

